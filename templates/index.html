<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACAS – Corpus Analysis System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="layout">

  <!-- ═══════════════════════════════════
       SIDEBAR
  ═══════════════════════════════════════ -->
  <aside class="sidebar">

    <!-- Brand -->
    <div class="sb-brand">
      <div class="sb-brand-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <ellipse cx="13" cy="6" rx="9" ry="3.5" fill="rgba(96,165,250,.25)" stroke="#60a5fa" stroke-width="1.4"/>
          <path d="M4 6v7c0 1.93 4.03 3.5 9 3.5s9-1.57 9-3.5V6"  stroke="#60a5fa" stroke-width="1.4" fill="none"/>
          <path d="M4 13v7c0 1.93 4.03 3.5 9 3.5s9-1.57 9-3.5v-7" stroke="#60a5fa" stroke-width="1.4" fill="none"/>
        </svg>
      </div>
      <div class="sb-brand-text">
        <span class="sb-brand-name">ACAS</span>
        <span class="sb-brand-sub">Agent-Driven Corpus Analysis System</span>
      </div>
    </div>

    <div class="sb-divider"></div>

    <!-- Upload -->
    <div class="sb-upload">
      <button class="btn-upload" id="uploadBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Upload Corpus
      </button>
      <input type="file" id="fileInput" style="display:none" accept=".txt,.csv,.json,.xml" />
    </div>

    <div class="sb-divider"></div>

    <!-- Scrollable middle: corpus library + conversations -->
    <div class="sb-scrollable">

      <!-- Corpus Library -->
      <div class="sb-section">
        <p class="sb-label">Corpus Library</p>
        <ul class="sb-list" id="corpusList">
          <li class="sb-empty">No corpora uploaded yet.</li>
        </ul>
      </div>

      <div class="sb-divider" style="margin: 8px 0;"></div>

      <!-- Conversation History -->
      <div class="sb-section">
        <div class="sb-section-header">
          <p class="sb-label">Conversations</p>
          <button class="btn-new-conv" id="newConvBtn">+ New</button>
        </div>
        <ul class="sb-list" id="convList">
          <li class="sb-empty">No conversations yet.</li>
        </ul>
      </div>

    </div>

    <!-- Available Agents (pinned bottom) -->
    <div class="sb-agents">
      <div class="sb-divider" style="margin-bottom:14px"></div>
      <p class="sb-label">Available Agents</p>
      <ul class="sb-list">
        <li class="sb-agent-item">
          <span class="agent-icon agent-freq">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
              <rect x="1"   y="7" width="3" height="6" rx=".4" fill="#fff"/>
              <rect x="5.5" y="4" width="3" height="9" rx=".4" fill="#fff"/>
              <rect x="10"  y="1" width="3" height="12" rx=".4" fill="#fff"/>
            </svg>
          </span>
          Frequency Analysis
        </li>
        <li class="sb-agent-item">
          <span class="agent-icon agent-kwic">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
              <circle cx="5.5" cy="5.5" r="4" stroke="#fff" stroke-width="1.5"/>
              <line x1="8.5" y1="8.5" x2="13" y2="13" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          KWIC Concordance
        </li>
        <li class="sb-agent-item">
          <span class="agent-icon agent-coll">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="1.5" width="12" height="2.5" rx=".6" fill="#fff" opacity=".5"/>
              <rect x="1" y="5.5" width="12" height="2.5" rx=".6" fill="#fff" opacity=".75"/>
              <rect x="1" y="9.5" width="12" height="2.5" rx=".6" fill="#fff"/>
            </svg>
          </span>
          N-gram / Collocation
        </li>
        <li class="sb-agent-item">
          <span class="agent-icon agent-kw">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
              <rect x="2" y="1" width="10" height="12" rx="1.5" stroke="#fff" stroke-width="1.4"/>
              <line x1="4.5" y1="5"   x2="9.5" y2="5"   stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="4.5" y1="7.5" x2="9.5" y2="7.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="4.5" y1="10"  x2="7.5" y2="10"  stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </span>
          Keyword Comparison
        </li>
      </ul>
    </div>

  </aside>

  <!-- ═══════════════════════════════════
       MAIN
  ═══════════════════════════════════════ -->
  <main class="main">
    <div class="chat-panel">

      <!-- Thread -->
      <div class="messages-scroll" id="messagesScroll">
        <div class="messages-inner" id="messagesInner">
          <!-- Initial welcome message is injected by main.js -->
        </div>
      </div>

      <!-- Composer -->
      <div class="input-bar">

        <!-- Corpus selectors -->
        <div class="corpus-row">
          <select id="corpusSelect">
            <option value="">— target corpus (required for analysis) —</option>
          </select>
          <select id="refSelect">
            <option value="">No reference corpus</option>
          </select>
        </div>

        <!-- Text input + send -->
        <div class="input-row">
          <textarea
            id="msgInput"
            class="msg-input"
            rows="2"
            placeholder="Ask for analysis… e.g. 'Top 20 frequent words', 'KWIC for justice', 'Find bigrams'"
          ></textarea>
          <button class="btn-send" id="sendBtn" aria-label="Send"></button>
        </div>

      </div>
    </div>
  </main>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
